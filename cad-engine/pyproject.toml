[project]
name = "watchlab-cad-engine"
version = "0.3.0"
description = "Local OpenCascade geometry engine for Watch Prototype Lab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cadquery-ocp>=7.9.3,<8",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pyinstaller>=6,<7"]

[project.scripts]
watchlab-cad = "watchlab_cad.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
